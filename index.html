<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f9e63">
  <meta name="description" content="Budżet rodzinny – dashboard domowych finansów.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Budżet rodzinny">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <title>Budżet rodzinny</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; padding:0; }
    body {
      min-height:100svh;
      overflow:hidden;
      background:#f4f6f7;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      overscroll-behavior:none;
    }
    #app-shell {
      position:relative;
      width:100%;
      height:100svh;
      padding-top:env(safe-area-inset-top);
      padding-right:env(safe-area-inset-right);
      padding-bottom:env(safe-area-inset-bottom);
      padding-left:env(safe-area-inset-left);
    }
    #app-frame {
      display:block;
      width:100%;
      height:100%;
      border:0;
      background:#f4f6f7;
    }
    #loading {
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      padding:24px;
      background:#f4f6f7;
      color:#6f767b;
      z-index:4;
      transition:opacity .22s ease;
    }
    #loading.is-hidden { opacity:0; pointer-events:none; }
    .loading-card {
      width:min(320px,100%);
      padding:24px;
      text-align:center;
      background:#fff;
      border:1px solid #eceff0;
      border-radius:22px;
      box-shadow:0 10px 30px rgba(0,0,0,.06);
    }
    .loading-icon { font-size:30px; margin-bottom:9px; }
    .loading-title { color:#222; font-weight:750; margin-bottom:5px; }
    .loading-subtitle { font-size:13px; color:#90969a; line-height:1.45; }
    #instant-snapshot {
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      background:#f4f6f7;
      z-index:2;
      display:none;
      pointer-events:none;
    }
    #instant-snapshot.is-visible { display:block; }
    #snapshot-status {
      position:absolute;
      left:50%;
      bottom:calc(12px + env(safe-area-inset-bottom));
      transform:translateX(-50%);
      z-index:3;
      display:none;
      padding:7px 11px;
      border-radius:999px;
      background:rgba(255,255,255,.94);
      border:1px solid #e7eaec;
      box-shadow:0 5px 16px rgba(0,0,0,.08);
      color:#7b8185;
      font-size:11px;
      font-weight:650;
      white-space:nowrap;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }
    #snapshot-status.is-visible { display:block; }
    #install-help {
      position:absolute;
      left:50%;
      bottom:calc(12px + env(safe-area-inset-bottom));
      transform:translateX(-50%);
      width:min(420px, calc(100% - 24px));
      padding:12px 14px;
      display:none;
      align-items:center;
      gap:10px;
      background:rgba(255,255,255,.96);
      border:1px solid #e7eaec;
      border-radius:17px;
      box-shadow:0 10px 28px rgba(0,0,0,.10);
      z-index:5;
      font-size:13px;
      color:#555;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }
    #install-help.is-visible { display:flex; }
    #install-help strong { color:#222; }
    #install-help button {
      margin-left:auto;
      border:0;
      border-radius:999px;
      padding:8px 12px;
      font-weight:750;
      background:#2f9e63;
      color:#fff;
      cursor:pointer;
      white-space:nowrap;
    }
    #install-dismiss {
      border:0 !important;
      background:transparent !important;
      color:#888 !important;
      padding:6px !important;
    }
    @media (max-width:520px) {
      #install-help { font-size:12px; }
      .loading-card { padding:22px 18px; }
    }
  </style>
</head>
<body>
  <main id="app-shell">
    <iframe
      id="app-frame"
      title="Budżet rodzinny"
      allow="fullscreen"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <iframe
      id="instant-snapshot"
      title="Ostatni zapisany widok budżetu"
      aria-hidden="true"
      tabindex="-1">
    </iframe>

    <div id="snapshot-status" aria-live="polite">
      Dane z pamięci · aktualizuję w tle…
    </div>

    <div id="loading" aria-live="polite">
      <div class="loading-card">
        <div class="loading-icon">💰</div>
        <div class="loading-title">Budżet rodzinny</div>
        <div class="loading-subtitle">Uruchamianie aplikacji…</div>
      </div>
    </div>

    <div id="install-help" role="status">
      <div><strong>Budżet rodzinny</strong><br><span id="install-text"></span></div>
      <button id="install-action" type="button">Dodaj</button>
      <button id="install-dismiss" type="button" aria-label="Zamknij">×</button>
    </div>
  </main>

  <script>
    (() => {
      'use strict';

      const VERSION = '2026-10-07-FRAME-BRIDGE-V9';
      const frame = document.getElementById('app-frame');
      const loading = document.getElementById('loading');
      const snapshotFrame = document.getElementById('instant-snapshot');
      const snapshotStatus = document.getElementById('snapshot-status');

      const APP_URL = "https://script.google.com/macros/s/AKfycbxwfK-V2xmXNcWylpVEQHRoaTcPn8hbmPW0CLrHIl82LuvU-sZg6cBSXDjEl2w6AK4vLQ/exec";

      // Szybka warstwa – localStorage. Zostawiamy stare klucze, aby V8
      // od razu przejęła cache zapisany przez V5/V7.
      const PWA_DASHBOARD_CACHE_KEY = 'budzet-pwa-dashboard-cache-v1';
      const PWA_MONTH_CACHE_KEY = 'budzet-pwa-month-cache-v1';
      const PWA_CATEGORY_CACHE_KEY = 'budzet-pwa-category-cache-v1';
      const PWA_REFRESH_STATE_KEY = 'budzet-pwa-refresh-state-v1';
      const PWA_SNAPSHOT_KEY = 'budzet-pwa-dashboard-snapshot-v1';
      const PWA_DIAGNOSTICS_KEY = 'budzet-pwa-start-diagnostics-v1';

      // Trwała warstwa – Cache Storage. Nie ma małego limitu localStorage
      // i na iOS jest niezależną kopią krytycznych danych startowych.
      const RUNTIME_CACHE_NAME = 'budzet-rodzinny-runtime-v8';
      const RUNTIME_BACKUP_URL = new URL('./__budget_runtime_v8__.json', location.href).href;
      const SNAPSHOT_BACKUP_URL = new URL('./__budget_snapshot_v8__.json', location.href).href;

      const SNAPSHOT_MAX_AGE_MS = 30 * 24 * 60 * 60 * 1000;
      const RUNTIME_MAX_AGE_MS = 30 * 24 * 60 * 60 * 1000;

      const startPerf = performance.now();
      const diagnostics = {
        version: VERSION,
        startedAt: Date.now(),
        serviceWorkerControlled: Boolean(navigator.serviceWorker && navigator.serviceWorker.controller),
        localSnapshot: false,
        durableSnapshot: false,
        liveFrameStartedMs: null,
        frameLoadMs: null,
        readyMs: null,
        durableBackupLoadedMs: null
      };
      window.__budgetDiagnostics = diagnostics;

      let appReady = false;
      let liveAppStarted = false;
      let snapshotVisible = false;
      let runtimePackage = null;
      let runtimePersistTimer = null;
      let shellRefreshScheduled = false;

      function elapsed_() {
        return Math.round(performance.now() - startPerf);
      }

      function safeGet_(key) {
        try { return localStorage.getItem(key); } catch (_) { return null; }
      }

      function safeSet_(key, value) {
        try {
          localStorage.setItem(key, value);
          return true;
        } catch (_) {
          return false;
        }
      }

      function readJson_(key) {
        const raw = safeGet_(key);
        if (!raw) return null;
        try { return JSON.parse(raw); } catch (_) { return null; }
      }

      function safeJsonStringify_(value) {
        try { return JSON.stringify(value); } catch (_) { return null; }
      }

      function persistDiagnostics_() {
        const raw = safeJsonStringify_(diagnostics);
        if (raw) safeSet_(PWA_DIAGNOSTICS_KEY, raw);
      }

      async function cacheReadJson_(url) {
        if (!('caches' in window)) return null;
        try {
          const cache = await caches.open(RUNTIME_CACHE_NAME);
          const response = await cache.match(url, { ignoreSearch: true });
          if (!response) return null;
          return await response.json();
        } catch (_) {
          return null;
        }
      }

      async function cacheWriteJson_(url, value) {
        if (!('caches' in window)) return false;
        const raw = safeJsonStringify_(value);
        if (!raw) return false;

        try {
          const cache = await caches.open(RUNTIME_CACHE_NAME);
          await cache.put(
            url,
            new Response(raw, {
              headers: {
                'Content-Type': 'application/json; charset=utf-8',
                'Cache-Control': 'no-store'
              }
            })
          );
          return true;
        } catch (_) {
          return false;
        }
      }

      function isSnapshotUsable_(snapshot) {
        return Boolean(
          snapshot &&
          snapshot.savedAt &&
          snapshot.html &&
          Date.now() - Number(snapshot.savedAt) <= SNAPSHOT_MAX_AGE_MS
        );
      }

      function buildSnapshotDocument_(snapshot) {
        const css = String(snapshot.css || '');
        const html = String(snapshot.html || '');
        return '<!doctype html><html lang="pl"><head>' +
          '<meta charset="utf-8">' +
          '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">' +
          '<style>' + css + '</style>' +
          '</head><body><div id="app">' + html + '</div></body></html>';
      }

      function showSnapshot_(snapshot, source) {
        if (!isSnapshotUsable_(snapshot) || appReady) return false;

        try {
          snapshotFrame.srcdoc = buildSnapshotDocument_(snapshot);
          snapshotFrame.classList.add('is-visible');
          snapshotStatus.textContent = 'Dane z pamięci telefonu · aktualizuję w tle…';
          snapshotStatus.classList.add('is-visible');
          loading.classList.add('is-hidden');
          snapshotVisible = true;

          if (source === 'local') diagnostics.localSnapshot = true;
          if (source === 'durable') diagnostics.durableSnapshot = true;
          persistDiagnostics_();
          return true;
        } catch (_) {
          return false;
        }
      }

      function showInstantLocalSnapshot_() {
        const snapshot = readJson_(PWA_SNAPSHOT_KEY);
        const shown = showSnapshot_(snapshot, 'local');

        // Migracja V5/V7 -> V8: jeżeli stary localStorage ma dobry snapshot,
        // od razu tworzymy drugą, trwalszą kopię w Cache Storage.
        if (isSnapshotUsable_(snapshot)) {
          cacheWriteJson_(SNAPSHOT_BACKUP_URL, snapshot);
        }

        return shown;
      }

      function hideStartupLayers_() {
        if (appReady) return;
        appReady = true;
        diagnostics.readyMs = elapsed_();
        persistDiagnostics_();

        loading.classList.add('is-hidden');
        snapshotFrame.classList.remove('is-visible');
        snapshotStatus.classList.remove('is-visible');
        snapshotVisible = false;
      }

      function localRuntimePackage_() {
        return {
          schema: 1,
          savedAt: Date.now(),
          dashboardCache: readJson_(PWA_DASHBOARD_CACHE_KEY),
          monthCache: readJson_(PWA_MONTH_CACHE_KEY),
          categoryCache: readJson_(PWA_CATEGORY_CACHE_KEY),
          refreshState: readJson_(PWA_REFRESH_STATE_KEY)
        };
      }

      function hasUsefulRuntimeData_(pkg) {
        return Boolean(
          pkg &&
          (
            pkg.dashboardCache ||
            pkg.monthCache ||
            pkg.categoryCache ||
            pkg.refreshState
          )
        );
      }

      function newestByTimestamp_(a, b, field) {
        if (!a) return b || null;
        if (!b) return a || null;
        const ta = Number(a[field] || 0);
        const tb = Number(b[field] || 0);
        return tb > ta ? b : a;
      }

      function mergeRuntimePackages_(localPkg, durablePkg) {
        const local = localPkg || {};
        const durable = durablePkg || {};

        return {
          schema: 1,
          savedAt: Math.max(Number(local.savedAt || 0), Number(durable.savedAt || 0), Date.now()),
          dashboardCache: newestByTimestamp_(local.dashboardCache, durable.dashboardCache, 'timestamp'),
          monthCache: newestByTimestamp_(local.monthCache, durable.monthCache, 'savedAt'),
          categoryCache: newestByTimestamp_(local.categoryCache, durable.categoryCache, 'savedAt'),
          // refreshState nie ma własnego savedAt; preferujemy lokalny, jeśli istnieje.
          refreshState: local.refreshState || durable.refreshState || null
        };
      }

      async function loadDurableBackups_() {
        const results = await Promise.all([
          cacheReadJson_(SNAPSHOT_BACKUP_URL),
          cacheReadJson_(RUNTIME_BACKUP_URL)
        ]);

        const durableSnapshot = results[0];
        const durableRuntime = results[1];

        diagnostics.durableBackupLoadedMs = elapsed_();

        if (!snapshotVisible && isSnapshotUsable_(durableSnapshot)) {
          showSnapshot_(durableSnapshot, 'durable');

          // Odtwarzamy też szybką kopię localStorage na przyszłe starty.
          const raw = safeJsonStringify_(durableSnapshot);
          if (raw) safeSet_(PWA_SNAPSHOT_KEY, raw);
        }

        runtimePackage = mergeRuntimePackages_(
          localRuntimePackage_(),
          durableRuntime && Date.now() - Number(durableRuntime.savedAt || 0) <= RUNTIME_MAX_AGE_MS
            ? durableRuntime
            : null
        );

        // Migracja istniejącego cache V5/V7 do trwałej warstwy V8 odbywa się
        // bez czekania na Apps Script. Dzięki temu pierwszy start po wdrożeniu
        // sam zabezpiecza dane na kolejne zimne uruchomienia.
        if (hasUsefulRuntimeData_(runtimePackage)) {
          cacheWriteJson_(RUNTIME_BACKUP_URL, runtimePackage);
        }

        return {
          snapshot: durableSnapshot,
          runtime: runtimePackage
        };
      }

      const durableLoadPromise = loadDurableBackups_().catch(() => ({ snapshot: null, runtime: null }));

      function scheduleRuntimePersist_() {
        if (runtimePersistTimer) clearTimeout(runtimePersistTimer);

        runtimePersistTimer = setTimeout(() => {
          runtimePersistTimer = null;
          if (!runtimePackage) return;
          runtimePackage.savedAt = Date.now();
          cacheWriteJson_(RUNTIME_BACKUP_URL, runtimePackage);
        }, 180);
      }

      function updateRuntimeComponent_(name, payload) {
        if (!runtimePackage) runtimePackage = localRuntimePackage_();
        runtimePackage[name] = payload || null;
        runtimePackage.savedAt = Date.now();
        scheduleRuntimePersist_();
      }

      let dashboardClient = null;
      let dashboardOrigin = null;

      // Accept only Google's dashboard inside OUR app iframe, including its
      // sandbox descendant. An unrelated tab/frame cannot request the cache.
      function isDashboardSender_(event) {
        if (!/^https:\/\/(?:script\.google\.com|[a-z0-9-]+\.googleusercontent\.com)$/.test(event.origin)) return false;
        let sender = event.source;
        try {
          for (let depth = 0; sender && depth < 8; depth++) {
            if (sender === frame.contentWindow) return true;
            const parent = sender.parent;
            if (!parent || parent === sender) break;
            sender = parent;
          }
        } catch (_) {}
        return false;
      }

      function postRestorePayload_(payload) {
        try {
          if (!dashboardClient || !dashboardOrigin) return;
          dashboardClient.postMessage(
            {
              source: 'budzet-pwa-v5',
              type: 'BUDZET_PWA_CACHE_RESTORE',
              payload: payload || {}
            },
            dashboardOrigin
          );
        } catch (_) {}
      }

      function sendCacheRestore_() {
        // 1) natychmiast wysyłamy szybką kopię localStorage.
        const localPkg = localRuntimePackage_();
        postRestorePayload_(localPkg);

        // 2) po odczycie trwałej kopii wysyłamy jeszcze raz scalony pakiet.
        // Dashboard V8 potrafi przyjąć ten drugi komunikat nawet po timeoutcie.
        durableLoadPromise.then(() => {
          const merged = mergeRuntimePackages_(localRuntimePackage_(), runtimePackage);
          if (hasUsefulRuntimeData_(merged)) {
            postRestorePayload_(merged);
          }
        }).catch(() => {});
      }

      window.addEventListener('message', (event) => {
        if (!isDashboardSender_(event)) return;

        const message = event.data || {};
        if (message.source !== 'budzet-dashboard-v5') return;
        dashboardClient = event.source;
        dashboardOrigin = event.origin;
        diagnostics.bridgeConnected = true;
        persistDiagnostics_();

        const payload = message.payload || {};

        if (message.type === 'BUDZET_PWA_CACHE_REQUEST') {
          sendCacheRestore_();
          return;
        }

        if (message.type === 'BUDZET_PWA_DASHBOARD_CACHE') {
          const raw = safeJsonStringify_(payload);
          if (raw) safeSet_(PWA_DASHBOARD_CACHE_KEY, raw);
          updateRuntimeComponent_('dashboardCache', payload);
          return;
        }

        if (message.type === 'BUDZET_PWA_MONTH_CACHE') {
          const raw = safeJsonStringify_(payload);
          if (raw) safeSet_(PWA_MONTH_CACHE_KEY, raw);
          updateRuntimeComponent_('monthCache', payload);
          return;
        }

        if (message.type === 'BUDZET_PWA_CATEGORY_CACHE') {
          const raw = safeJsonStringify_(payload);
          if (raw) safeSet_(PWA_CATEGORY_CACHE_KEY, raw);
          updateRuntimeComponent_('categoryCache', payload);
          return;
        }

        if (message.type === 'BUDZET_PWA_REFRESH_STATE') {
          const raw = safeJsonStringify_(payload);
          if (raw) safeSet_(PWA_REFRESH_STATE_KEY, raw);
          updateRuntimeComponent_('refreshState', payload);
          return;
        }

        if (message.type === 'BUDZET_PWA_DASHBOARD_SNAPSHOT') {
          const raw = safeJsonStringify_(payload);
          if (raw) safeSet_(PWA_SNAPSHOT_KEY, raw);

          // Snapshot jest krytyczny dla zimnego startu, więc zapisujemy go
          // od razu do Cache Storage – bez debounce i niezależnie od localStorage.
          cacheWriteJson_(SNAPSHOT_BACKUP_URL, payload);
          return;
        }

        if (message.type === 'BUDZET_PWA_READY') {
          requestAnimationFrame(() => {
            setTimeout(() => {
              hideStartupLayers_();
              scheduleShellRefresh_();
            }, 30);
          });
        }
      });

      function startLiveApp_() {
        if (liveAppStarted) return;
        liveAppStarted = true;
        diagnostics.liveFrameStartedMs = elapsed_();
        persistDiagnostics_();
        frame.src = APP_URL;
      }

      // KROK 1: synchronizacyjnie pokazujemy snapshot z localStorage.
      const hasLocalSnapshot = showInstantLocalSnapshot_();

      // KROK 2: jeżeli localStorage nie ma snapshotu, dajemy Cache Storage
      // krótkie 250 ms na odtworzenie trwałej kopii. To nadal wielokrotnie
      // szybciej niż start Apps Script na LTE i eliminuje pusty loader.
      if (hasLocalSnapshot) {
        requestAnimationFrame(() => setTimeout(startLiveApp_, 60));
      } else {
        Promise.race([
          durableLoadPromise,
          new Promise(resolve => setTimeout(resolve, 250))
        ]).finally(startLiveApp_);
      }

      frame.addEventListener('load', () => {
        diagnostics.frameLoadMs = elapsed_();
        persistDiagnostics_();

        // Samo załadowanie HTML Apps Script nie oznacza gotowego dashboardu.
        // Jeżeli snapshot jest widoczny, pozostaje na ekranie aż do READY.
        if (snapshotVisible) return;

        // Pierwsze uruchomienie na zupełnie nowym urządzeniu może nie mieć cache.
        // Wtedy po 4 s pokazujemy iframe zamiast zasłaniać go loaderem rodzica.
        setTimeout(() => {
          if (!appReady && !snapshotVisible) {
            loading.classList.add('is-hidden');
          }
        }, 4000);
      }, { once: true });

      // Service Worker NIE może już wykonywać sieci w ścieżce startowej.
      // Rejestrację/aktualizację odkładamy do chwili, gdy shell jest już na ekranie.
      function scheduleShellRefresh_() {
        if (!("serviceWorker" in navigator) || shellRefreshScheduled) return;
        shellRefreshScheduled = true;

        setTimeout(() => {
          navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" })
            .then(reg => {
              // Sprawdzenie nowego sw.js nie wpływa na bieżący start.
              setTimeout(() => reg.update().catch(() => {}), 1200);

              // Po ustabilizowaniu aplikacji odświeżamy pliki powłoki w tle.
              setTimeout(() => {
                const target = navigator.serviceWorker.controller || reg.active;
                if (target) {
                  try { target.postMessage({ type: 'BUDZET_REFRESH_SHELL' }); } catch (_) {}
                }
              }, 2500);
            })
            .catch(() => {});
        }, 600);
      }

      // Jeśli z jakiegoś powodu READY nie przyjdzie (np. brak sieci), a snapshot
      // jest widoczny, zostawiamy go. SW można mimo to zarejestrować po 5 s.
      setTimeout(() => {
        if (!appReady) scheduleShellRefresh_();
      }, 5000);

      const installHelp = document.getElementById('install-help');
      const installText = document.getElementById('install-text');
      const installAction = document.getElementById('install-action');
      const installDismiss = document.getElementById('install-dismiss');
      let deferredPrompt = null;

      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredPrompt = event;
        installText.textContent = 'Zainstaluj na ekranie głównym.';
        installAction.textContent = 'Zainstaluj';
        installHelp.classList.add('is-visible');
      });

      installAction.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        try { await deferredPrompt.userChoice; } catch (_) {}
        deferredPrompt = null;
        installHelp.classList.remove('is-visible');
      });

      installDismiss.addEventListener('click', () => {
        installHelp.classList.remove('is-visible');
      });

      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

      if (isIOS && isSafari && !isStandalone && !localStorage.getItem('budzet-ios-install-help-dismissed')) {
        installText.textContent = 'W Safari wybierz Udostępnij → Dodaj do ekranu początkowego.';
        installAction.textContent = 'Jak?';
        installAction.addEventListener('click', () => {
          installHelp.classList.remove('is-visible');
        }, { once: true });
        installHelp.classList.add('is-visible');
      }

      if (isStandalone) document.documentElement.classList.add('is-standalone');

      // Best-effort: na przeglądarkach, które to wspierają, prosimy o
      // trwalsze przechowywanie danych PWA. Brak wsparcia/zgody niczego nie blokuje.
      if (navigator.storage && typeof navigator.storage.persist === 'function') {
        setTimeout(() => {
          try { navigator.storage.persist().catch(() => {}); } catch (_) {}
        }, 3000);
      }
    })();
  </script>
</body>
</html>
